    <path d="M186 104h30"/>
    <path d="M40 200h84"/>
  </g>
  <circle cx="108" cy="108" r="62" fill="#0f172a" stroke="url(#ring)" stroke-width="18"/>
  <path d="M154 154l52 52" stroke="#f97316" stroke-width="26" stroke-linecap="round"/>
  <!-- A passing route. -->
  <path d="M80 110l20 20 38-42" fill="none" stroke="#5eead4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
